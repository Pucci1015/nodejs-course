# 開発とテストで使う PostgreSQL と Redis（第6部 第32章と同じ形）
#   docker compose up -d --wait   → 起動して、使えるようになるまで待つ
#   docker compose down           → 止める（-v を付けると、データベースの中身も消える）
# パスワードは、この PC の中だけで使う開発用の仮のもの（本物の値は、ここにも書かない）
# 第6部の compose.yaml（5433・6380）や、第12部の成果物とぶつからないように、5434・6381 を使う
name: room-booking-dev

services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: dev-only-password
      POSTGRES_DB: roombooking
    ports:
      - '127.0.0.1:5434:5432'
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'app', '-d', 'roombooking']
      interval: 2s
      timeout: 3s
      retries: 15

  redis:
    image: redis:8
    ports:
      - '127.0.0.1:6381:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  pgdata:
