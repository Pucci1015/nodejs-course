# 第70章 練習問題2: 穴を埋めて、アプリの CI を完成させる（本文 4節）。push とプルリクエストのたびに、API・画面・E2E を確かめる（第59章 7節。第12部の成果物と同じ形）
# ジョブは3つ。api と web は同時に動き、両方が通ったら e2e が動く
# 執筆の環境からは GitHub で動かしていません（YAML として読めることと、各コマンドが手元で通ることだけを確かめた）
name: CI

on:
  push:
    branches: [main]
  pull_request:

# GITHUB_TOKEN には、リポジトリを読むことだけを許す
permissions:
  contents: read

# 同じブランチで新しく動いたら、古いほうを止める
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # テストが使う PostgreSQL（このリポジトリの compose.yaml と同じ設定。ポートも 5434 にそろえる）
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: dev-only-password
          POSTGRES_DB: roombooking
        ports:
          - '5434:5432'
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # 仕事の列と SSE の知らせに使う Redis（このリポジトリの compose.yaml と同じ 6381）
      redis:
        image: redis:8
        ports:
          - '6381:6379'
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      # 型 → lint → 書き方 → テスト（単体・制約・リポジトリ・HTTP の 90 個）
      - run: npm run check
      # 本番で使うパッケージに、重い（high 以上の）脆弱性が無いか（第10部 第55章）
      - run: npm audit --omit=dev --audit-level=high

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # ここを書く: このジョブの run を、すべて web/ の中で動かす（defaults）
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          # ここを書く: キャッシュのキーにするロックファイル（web/ は、別の package-lock.json を持つ）
      # ここを書く: 3つの run（パッケージを入れる・npm run check・本番で使うパッケージの脆弱性）

  e2e:
    # ここを書く: api と web の両方が通ってから動く
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: dev-only-password
          POSTGRES_DB: roombooking
        ports:
          - '5434:5432'
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # 仕事の列と SSE の知らせに使う Redis（このリポジトリの compose.yaml と同じ 6381）
      redis:
        image: redis:8
        ports:
          - '6381:6379'
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm ci --ignore-scripts
        working-directory: web
      # ブラウザと、ブラウザが要る Linux のライブラリを入れる
      - run: npx playwright install --with-deps chromium
      # playwright.config.ts が、偽の SMTP サーバと API（画面のビルドを含む）を起動してから動かす
      - run: npm run e2e
      # 失敗したときだけ、トレースなどをダウンロードできるように残す
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: test-results
          retention-days: 7
