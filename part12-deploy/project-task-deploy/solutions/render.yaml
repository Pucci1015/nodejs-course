# 追加（第12部）: Render の Blueprint（第62章 8節の render.yaml に、ワーカー・S3・メール・独自ドメインを足した）
# 置き場所: リポジトリのいちばん上。Render のダッシュボードの「New → Blueprint」で、このリポジトリを選ぶ
# 執筆の環境からは Render で動かしていません（YAML として読めることと、形だけを確かめた）。
# 項目の名前・プラン・リージョン・版は変わることがあるので、必ず公式（https://render.com/docs/blueprint-spec）で確認してください
# 秘密の値（sync: false）は、このファイルに書かず、ダッシュボードで入れる
envVarGroups:
  - name: task-app-shared # API とワーカーで同じ値
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_URL
        value: https://app.example.com # 独自ドメイン（example.com は例。自分のドメインにする）
      - key: SESSION_SECRET
        generateValue: true # Render が乱数で作る
      - key: CURSOR_SECRET
        generateValue: true
      - key: METRICS_TOKEN
        generateValue: true
      - key: S3_ENDPOINT # S3 互換のストレージの入口（例: Cloudflare R2 の https://<アカウント>.r2.cloudflarestorage.com）
        sync: false
      - key: S3_REGION
        value: auto # R2 は auto。AWS の S3 なら ap-northeast-1 など
      - key: S3_BUCKET
        value: task-files
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: SMTP_HOST # メールの送信サービス（第53章 8節）
        sync: false
      - key: SMTP_PORT
        value: '587'
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        value: 'Task App <no-reply@app.example.com>'

services:
  - type: web
    name: task-app
    runtime: docker # リポジトリの Dockerfile で build する（画面のビルドも、その中で）
    dockerfilePath: ./Dockerfile
    region: singapore
    plan: starter
    autoDeployTrigger: 'off' # push しただけではデプロイしない。GitHub Actions がテストの後で頼む（.github/workflows/deploy.yml）
    healthCheckPath: /readyz # これが 200 になってから、新しい版に客を回す
    preDeployCommand: node src/db/migrate.ts # 新しい版に回す前に、マイグレーションを1回だけ
    domains:
      - app.example.com # DNS に CNAME を足すと、Render が証明書を取る（第62章 5節）
    envVars:
      - fromGroup: task-app-shared
      - key: WORKER_MODE
        value: separate # 仕事は、下のワーカーが処理する
      - key: TRUST_PROXY
        value: '1' # Render のロードバランサが前に 1 つ（第60章 7節）
      - key: DATABASE_URL
        fromDatabase:
          name: task-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: task-redis
          property: connectionString

  - type: worker # HTTP を待たない、仕事を処理するだけのサービス
    name: task-worker
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerCommand: node src/worker.ts
    region: singapore
    plan: starter
    autoDeployTrigger: 'off'
    envVars:
      - fromGroup: task-app-shared
      - key: DATABASE_URL
        fromDatabase:
          name: task-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: task-redis
          property: connectionString

  - type: keyvalue # Redis と同じ使い方ができる入れ物（仕事の列と、SSE の知らせ）
    name: task-redis
    region: singapore
    plan: starter
    maxmemoryPolicy: noeviction # 仕事の列のキーを、メモリが足りないからと消されないように（BullMQ の求め）
    ipAllowList: [] # Render の中からだけつなげる

databases:
  - name: task-db
    region: singapore
    plan: basic-256mb
    databaseName: taskapi
    user: app
    postgresMajorVersion: '18'
    ipAllowList: []
