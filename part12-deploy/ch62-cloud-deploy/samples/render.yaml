# 第62章 8節: Render の Blueprint（設定をコードにしたもの）の例
# 置き場所: リポジトリのいちばん上の render.yaml
# 執筆の環境からは Render で動かしていません。項目の名前・プラン・リージョン・版は変わることがあるので、
# 必ず公式（https://render.com/docs/blueprint-spec）で確認してください。
services:
  - type: web
    name: task-app
    runtime: docker # リポジトリの Dockerfile で build する
    dockerfilePath: ./Dockerfile
    region: singapore
    plan: starter
    autoDeployTrigger: 'off' # push しただけではデプロイしない。GitHub Actions がテストの後で頼む（7節）
    healthCheckPath: /readyz # これが 200 になってから、新しい版に客を回す
    preDeployCommand: node src/db/migrate.ts # 新しい版に回す前に、マイグレーションを1回だけ
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: task-db
          property: connectionString # Render の中の道（内部の URL）
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: task-redis
          property: connectionString
      - key: SESSION_SECRETS
        generateValue: true # Render が乱数で作る。リポジトリには書かない
      - key: SMTP_PASS
        sync: false # 値はダッシュボードで入れる（このファイルには書かない）

  - type: keyvalue # Redis と同じ使い方ができる入れ物
    name: task-redis
    region: singapore
    plan: starter
    ipAllowList: [] # Render の中からだけつなげる

databases:
  - name: task-db
    region: singapore
    plan: basic-256mb
    databaseName: taskapi
    user: app
    postgresMajorVersion: '18'
    ipAllowList: [] # Render の中からだけつなげる
